<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pick Sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDE7; --paper:#F6F8F4; --ink:#15231A; --soft:#4C5C51; --line:#C6D0C4;
  --turf:#2E6B3B; --turf-2:#285F34; --chalk:#F4F7F2; --pylon:#E8641B; --model:#1D3557; --claude:#6B4FA0;
  --good:#1F7A3A; --bad:#B23A2A;
  --display:"Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body:"Barlow", "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101813; --paper:#18221B; --ink:#E6ECE5; --soft:#A3B1A6; --line:#2E3B32;
    --turf:#24552F; --turf-2:#1F4B29; --chalk:#E8EEE6; --pylon:#FF7A2E; --model:#9DB8E8; --claude:#B9A2E8;
    --good:#58C27A; --bad:#F07A66;
  }
}
:root[data-theme="dark"]{
  --bg:#101813; --paper:#18221B; --ink:#E6ECE5; --soft:#A3B1A6; --line:#2E3B32;
  --turf:#24552F; --turf-2:#1F4B29; --chalk:#E8EEE6; --pylon:#FF7A2E; --model:#9DB8E8; --claude:#B9A2E8;
  --good:#58C27A; --bad:#F07A66;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 64px}
p{max-width:68ch;margin:.6em 0}
button{font:600 15px var(--body);cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--pylon);outline-offset:2px}

/* sport tabs */
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg)}
.tabs{max-width:980px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;color:inherit;font:700 19px/1 var(--display);letter-spacing:.02em;padding:15px 14px 12px;border-bottom:4px solid transparent;opacity:.75}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:var(--pylon)}
.tab:disabled{opacity:.35;cursor:default;font-weight:500}
.tab:disabled small{font:500 12px var(--body);margin-left:5px}

header.sport{padding-top:28px}
h1{font:700 clamp(40px,8vw,72px)/.9 var(--display);letter-spacing:-.01em;margin:0}
h1 small{display:block;font:600 20px/1.2 var(--display);color:var(--soft);letter-spacing:.01em;margin-top:8px}
.lede{color:var(--soft)}

.legend{display:flex;flex-wrap:wrap;gap:14px 20px;font-size:14px;color:var(--soft);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.mk{display:inline-block;width:12px;height:12px}
.mk.elo{border:2px solid var(--model);border-radius:50%}
.mk.eff{background:var(--model);border-radius:50%;opacity:.55}
.mk.comb{background:var(--model);transform:rotate(45deg)}
.mk.cl{background:var(--claude);border-radius:2px}
.mk.mkt{width:4px;height:16px;background:var(--pylon)}
.note{font-size:14px;color:var(--soft)}

/* NFL field strip */
.hero{margin:22px 0 8px}
.field{position:relative;height:46px;border-radius:6px;background:var(--turf);overflow:hidden}
.field .ln{position:absolute;top:0;bottom:0;width:1px;background:var(--chalk);opacity:.28}
.field .ez{position:absolute;top:0;bottom:0;width:7%;display:flex;align-items:center;justify-content:center;color:var(--chalk);font:700 14px var(--display);letter-spacing:.04em;background:rgba(0,0,0,.18)}
.field .ez.l{left:0}.field .ez.r{right:0}
.field .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--chalk);opacity:.85}
.field .yl{position:absolute;bottom:3px;color:var(--chalk);font:600 10px var(--display);opacity:.75;transform:translateX(-50%)}
.field .pt{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;background:var(--chalk)}
.field .pt.elo{border:2px solid var(--chalk);background:transparent;border-radius:50%}
.field .pt.eff{border-radius:50%;opacity:.6}
.field .pt.comb{transform:rotate(45deg);background:#fff;box-shadow:0 0 0 2px var(--model)}
.field .pt.cl{background:var(--claude);border-radius:2px;box-shadow:0 0 0 2px #fff;width:11px;height:11px;margin:-5.5px 0 0 -5.5px}
.field .mkt{position:absolute;top:4px;bottom:4px;width:4px;margin-left:-2px;background:var(--pylon);border-radius:2px}

/* EPL pitch bar: home | draw | away */
.pitch{position:relative;height:46px;border-radius:6px;overflow:hidden;display:flex;background:repeating-linear-gradient(90deg,var(--turf) 0 24px,var(--turf-2) 24px 48px)}
.pitch .seg{position:relative;display:flex;align-items:center;padding:0 10px;color:var(--chalk);font:700 17px/1 var(--display);white-space:nowrap;overflow:hidden;min-width:0}
.pitch .seg + .seg{border-left:2px solid var(--chalk)}
.pitch .seg.d{justify-content:center;background:rgba(0,0,0,.22)}
.pitch .seg.a{justify-content:flex-end}
.pitch .seg small{font:500 13px var(--body);margin-left:6px;opacity:.85}
.pitch .mkt{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--pylon)}
.pitch .mkt::after{content:"";position:absolute;left:-4px;top:0;border:6px solid transparent;border-top-color:var(--pylon)}

.bt{margin:26px 0 8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.bt h2,.nudge h2{font:700 26px/1.1 var(--display);margin:0 0 8px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:460px}
th,td{text-align:right;padding:6px 10px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font:600 14px var(--body);color:var(--soft)}
tr.hl td{font-weight:600}
.warn{border-left:4px solid var(--pylon);padding:6px 0 6px 12px;margin:12px 0 0}

.nudge{margin:22px 0;display:grid;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.nudge h2,.nudge p{margin:0}
.nudge .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--claude);color:#fff;border:0;border-radius:8px;padding:10px 16px}
.btn[disabled]{opacity:.5;cursor:default}
.status{font-size:14px;color:var(--soft)}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.filters button{background:transparent;border:1.5px solid var(--ink);color:var(--ink);border-radius:999px;padding:6px 14px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.slot{margin-top:30px}
.slot h2{font:700 22px/1.1 var(--display);color:var(--soft);margin:0 0 8px}
.game{padding:18px 0 20px;border-top:2px solid var(--ink)}
.matchup{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:10px}
.teams{font:700 30px/1 var(--display)}
.teams .at{color:var(--soft);font-weight:500;margin:0 .3em}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;font-weight:600;padding:2px 9px;border-radius:4px;border:1.5px solid currentColor}
.tag.doubt{color:var(--claude)}.tag.vs{color:var(--pylon)}.tag.final{color:var(--ink);background:var(--paper)}.tag.qb{color:var(--bad)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:6px 14px;margin-top:12px;font-size:14px}
.nums div{display:flex;flex-direction:column}
.nums b{font:600 18px/1.2 var(--display)}
.nums .lab{color:var(--soft)}
.nums .mkt b{color:var(--pylon)}
.right b{color:var(--good)}.wrong b{color:var(--bad)}
.ptab{margin-top:12px;font-size:15px}
.ptab table{min-width:0;table-layout:fixed}
.ptab th:first-child,.ptab td:first-child{width:34%}
.ptab th{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptab td.best{font-weight:700}
.ptab tr.mkt td{color:var(--pylon)}
.ptab tr.cl td:first-child{color:var(--claude)}
details{margin-top:10px}
summary{cursor:pointer;font-weight:600;font-size:15px}
.bars{display:grid;gap:5px;margin:10px 0}
.bar{display:grid;grid-template-columns:110px 1fr 52px;gap:10px;align-items:center;font-size:14px}
.track{position:relative;height:10px;background:var(--line);border-radius:5px}
.track i{position:absolute;top:0;bottom:0;border-radius:5px}
.track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.facts{font-size:14px;color:var(--soft);margin:6px 0}
.reason{font-size:15px;margin:8px 0}
.reason b{color:var(--claude)}
.empty{color:var(--soft);font-style:italic}
.subnav{display:flex;gap:0;margin:20px 0 0;border:2px solid var(--ink);border-radius:8px;width:max-content;overflow:hidden}
.subnav button{background:transparent;border:0;color:var(--ink);padding:9px 18px;font:700 18px/1 var(--display);letter-spacing:.02em}
.subnav button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.subnav button:disabled{opacity:.4;cursor:default}
select{font:600 15px var(--body);color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
table.props td.best{font-weight:700}
.pos{font-size:12px;font-weight:600;color:var(--soft)}
.inj{margin-top:12px;display:grid;gap:4px}
.inj .lab{font-size:14px;color:var(--soft)}
.injrow{margin:0;display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:13px}
.injrow b{font:600 15px var(--display);margin-right:2px}
.chip{border-radius:4px;padding:1px 7px;font-weight:600;border:1.5px solid currentColor}
.chip.out{color:var(--bad)}.chip.q{color:var(--soft)}
.qbnote{margin:2px 0 0;font-size:14px;font-weight:600;color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:22px 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .lab{font-size:13px;color:var(--soft)}
.stat b{font:700 28px/1.1 var(--display)}
.h2{font:700 24px/1.1 var(--display);margin:26px 0 8px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--soft)}
.fld input,.ta{font:500 15px var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.fld input:focus,.ta:focus,select:focus{outline:3px solid var(--pylon);outline-offset:1px}
.ta{margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mini{background:transparent;border:1.5px solid var(--ink);color:var(--ink);border-radius:6px;padding:3px 9px;font-size:13px}
.mini.sug{background:var(--ink);color:var(--bg)}
.mini.ghost{border-color:transparent;color:var(--soft);text-decoration:underline}
table.bets td{vertical-align:top}
table.bets td.acts{min-width:210px}
table.bets tr.soon td:first-child{box-shadow:inset 4px 0 0 var(--pylon)}
.closein{font:500 14px var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:4px 8px;width:100%;max-width:210px;margin:6px 0}
.check{display:flex;gap:8px;align-items:flex-start;font-size:15px;margin:4px 0 10px}
.check input{margin-top:4px}
[hidden]{display:none!important}
@media (max-width:560px){.ptab{font-size:14px}.ptab th,.ptab td{padding:6px 5px}.field .ez{font-size:11px;letter-spacing:0}.teams{font-size:25px}.bar{grid-template-columns:90px 1fr 46px}.pitch .seg small{display:none}.tab{font-size:17px;padding:14px 10px 11px}}
</style>
</head>
<body>
<nav class="tabbar" aria-label="Sports">
  <div class="tabs" role="tablist" id="tabs"></div>
</nav>
<div class="wrap" id="panels"><p class="empty" id="loading" style="padding-top:28px">Loading pick sheets…</p></div>
<script>
window.addEventListener("error", e => { const p = document.getElementById("panels"); if (p) { const m = document.createElement("p"); m.className = "empty"; m.style.paddingTop = "20px"; m.textContent = "Something went wrong loading this page: " + (e.message || "unknown error"); p.prepend(m); } });
</script>

<script>
(() => {
const NFL = __NFL__;
const EPL = __EPL__;
const SPORTS = [
  {key:"nfl", label:"NFL", data:NFL},
  {key:"epl", label:"Premier League", data:EPL},
  {key:"bets", label:"My Bets"},
  {key:"laliga", label:"La Liga"}, {key:"seriea", label:"Serie A"}, {key:"bundesliga", label:"Bundesliga"},
  {key:"ligue1", label:"Ligue 1"}, {key:"ucl", label:"Champions League"}, {key:"ligamx", label:"Liga MX"},
  {key:"unl", label:"Nations League"}, {key:"ufc", label:"UFC"},
];
const TIERS = [["haiku_v4","Haiku 4.5 (prompt v4)"],["haiku","Haiku 4.5"],["sonnet","Sonnet 5"],["opus","Opus 5.5"]];
const nudgesFrom = D => Object.fromEntries(TIERS.map(([k]) => [k, (D.nudges && D.nudges[k]) || {}]));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const started = g => Date.now() >= Date.parse(g.kickoff_utc);
const slotName = iso => { const d = new Date(iso); return d.toLocaleDateString("en-US", {weekday:"long", month:"short", day:"numeric", timeZone:"America/New_York"}) + ", " + d.toLocaleTimeString("en-US", {hour:"numeric", minute:"2-digit", timeZone:"America/New_York"}) + " ET"; };
const builtText = iso => new Date(iso.replace("Z", ":00Z")).toLocaleString("en-US", {dateStyle:"medium", timeStyle:"short", timeZone:"America/New_York"}) + " ET";
const pctTxt = p => Math.round(p * 100) + "%";

function section(tag, cls, html) { const s = el(tag, cls); if (html) s.innerHTML = html; return s; }
function filtersBar(options, onPick) {
  const bar = el("div", "filters"); bar.setAttribute("role", "group"); bar.setAttribute("aria-label", "Filter games");
  options.forEach(([key, label], i) => { const b = el("button", null, label); b.setAttribute("aria-pressed", String(i === 0)); b.onclick = () => { bar.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); onPick(key); }; bar.append(b); });
  return bar;
}
function grouped(list, games, card) {
  list.replaceChildren();
  if (!games.length) { list.append(el("p", "empty", "No games match this filter.")); return; }
  const slots = new Map();
  for (const g of games) { const k = slotName(g.kickoff_utc); if (!slots.has(k)) slots.set(k, []); slots.get(k).push(g); }
  for (const [k, gs] of slots) { const s = el("section", "slot"); s.append(el("h2", null, k), ...gs.map(card)); list.append(s); }
}
function modelPanel(S, unit, blurb) {
  const box = el("section", "nudge");
  box.append(el("h2", null, "How each Claude model nudged the math"), el("p", "note", blurb));
  const any = TIERS.some(([k]) => Object.keys(S.nudges[k]).length);
  if (!any) { box.append(el("p", "note", "Not run yet for this slate. Run nudge.py before kickoff to add them.")); return box; }
  const tb = el("div", "tbl"), t = el("table");
  t.innerHTML = "<thead><tr><th>Model</th><th>Nudged</th><th>Average nudge</th><th>Biggest</th></tr></thead>";
  const body = el("tbody");
  for (const [k, label] of TIERS) {
    const v = Object.values(S.nudges[k]).map(n => Math.abs(n.nudge)); const tr = el("tr");
    tr.append(el("td", null, label), el("td", null, v.length ? v.filter(x => x > 0.001).length + " of " + v.length : "not run"),
      el("td", null, v.length ? (v.reduce((a, b) => a + b, 0) / v.length).toFixed(2) + " " + unit : "–"), el("td", null, v.length ? Math.max(...v).toFixed(unit === "pts" ? 1 : 2) + " " + unit : "–"));
    body.append(tr);
  }
  t.append(body); tb.append(t); box.append(tb);
  box.append(el("p", "note", "Haiku 4.5: temperature 0, no thinking. Sonnet 5: adaptive thinking, default effort (high). Opus 5.5: adaptive thinking, default effort (medium). Prompt v4 is the original, looser prompt; v5 tells the models to leave most games alone; v6 (NFL) also gives them each team's injury report and expected starting QB. Nudges are saved before kickoff and never overwritten."));
  const used = new Set(TIERS.flatMap(([k]) => Object.values(S.nudges[k]).map(n => n.prompt)).filter(Boolean));
  if (S.key === "nfl" && used.size && !used.has("v6")) box.append(el("p", "note warn", "This slate's nudges were saved before injury reports were added, so the Claude models did not see them (for example, a starting QB ruled out). The injury report on each game below is current; the nudges will include it from the next slate."));
  return box;
}

// ======================= NFL =======================
const NFL_TEAMS = {ARI:"Cardinals",ATL:"Falcons",BAL:"Ravens",BUF:"Bills",CAR:"Panthers",CHI:"Bears",CIN:"Bengals",CLE:"Browns",DAL:"Cowboys",DEN:"Broncos",DET:"Lions",GB:"Packers",HOU:"Texans",IND:"Colts",JAX:"Jaguars",KC:"Chiefs",LA:"Rams",LAC:"Chargers",LV:"Raiders",MIA:"Dolphins",MIN:"Vikings",NE:"Patriots",NO:"Saints",NYG:"Giants",NYJ:"Jets",PHI:"Eagles",PIT:"Steelers",SEA:"Seahawks",SF:"49ers",TB:"Buccaneers",TEN:"Titans",WAS:"Commanders"};
const nflSport = {key:"nfl", data:NFL, nudges:nudgesFrom(NFL), filter:"all"};
{
  const S = nflSport, D = NFL, NAME = t => NFL_TEAMS[t] || t, RANGE = 30;
  const winner = (g, m) => m >= 0 ? g.home : g.away;
  const phi = x => { const t = 1/(1+0.3275911*Math.abs(x)/Math.SQRT2), y = 1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x/2); return 0.5*(1+Math.sign(x)*y); };
  const pos = m => 50 + Math.max(-1, Math.min(1, m / RANGE)) * 43;
  const qbChange = g => ["away","home"].filter(s => g.facts.qb_last_game[s] && g.facts.starting_qb[s] && g.facts.qb_last_game[s] !== g.facts.starting_qb[s]);
  const nudged = (g, t) => { const n = S.nudges[t][g.id]; return n ? g.preds.comb.margin + n.nudge : null; };
  const allM = g => [g.preds.elo.margin, g.preds.eff.margin, g.preds.comb.margin, ...TIERS.map(([t]) => nudged(g, t)).filter(v => v !== null)];
  const F = { all: () => true, doubt: g => new Set(allM(g).map(m => m >= 0)).size > 1,
    vs: g => g.market !== null && (g.preds.comb.margin >= 0) !== (g.market >= 0),
    gap: g => g.market !== null && Math.abs(g.preds.comb.margin - g.market) >= 3 };
  function field(g) {
    const f = el("div", "field"); f.setAttribute("aria-hidden", "true");
    f.append(el("span", "ez l", g.away), el("span", "ez r", g.home));
    for (let y = -25; y <= 25; y += 5) { if (!y) continue; const ln = el("span", "ln"); ln.style.left = pos(y) + "%"; f.append(ln); }
    f.append(el("span", "mid"));
    for (const y of [-20, -10, 10, 20]) { const s = el("span", "yl", String(Math.abs(y))); s.style.left = pos(y) + "%"; f.append(s); }
    if (g.market !== null) { const k = el("span", "mkt"); k.style.left = pos(g.market) + "%"; f.append(k); }
    for (const k of ["elo", "eff", "comb"]) { const p = el("span", "pt " + k); p.style.left = pos(g.preds[k].margin) + "%"; f.append(p); }
    for (const [t] of TIERS) { const m = nudged(g, t); if (m !== null) { const p = el("span", "pt cl"); p.style.left = pos(m) + "%"; f.append(p); } }
    return f;
  }
  function num(g, label, m, hp, cls) {
    const d = el("div", cls || ""); d.append(el("span", "lab", label));
    if (m === null) { d.append(el("b", null, "–")); return d; }
    d.append(el("b", null, NAME(winner(g, m)) + " by " + Math.abs(m).toFixed(1)));
    if (hp !== undefined) d.append(el("span", null, Math.round((m >= 0 ? hp : 1 - hp) * 100) + "% to win"));
    if (g.final) d.classList.add(((m >= 0) === (g.final[1] > g.final[0])) ? "right" : "wrong");
    return d;
  }
  function card(g) {
    const a = el("article", "game"), top = el("div", "matchup"), teams = el("div", "teams");
    teams.append(NAME(g.away), el("span", "at", g.neutral ? "vs" : "at"), NAME(g.home));
    const tags = el("div", "tags");

      if (b.type === "spread" && typeof b.line === "number") return phiB((m + b.line) / NFL.sigma);
    }

    return null;
  }
  function suggestResult(b) {        // grade from the sheet's final score when possible
    const x = b.game_id && findGame(b.game_id); if (!x || !x.g.final) return null;
    const f = x.g.final;
    if (x.sport === "NFL") {
      const m = (f[1] - f[0]) * (b.side === "home" ? 1 : b.side === "away" ? -1 : NaN);
      if (Number.isNaN(m)) return null;
      if (b.type === "moneyline") return m > 0 ? "won" : m < 0 ? "lost" : "push";
      if (b.type === "spread" && typeof b.line === "number") { const c = m + b.line; return c > 0 ? "won" : c < 0 ? "lost" : "push"; }
    }
    if (x.sport === "EPL" && b.type === "moneyline") { const r = f[0] > f[1] ? "home" : f[0] < f[1] ? "away" : "draw"; return r === b.side ? "won" : "lost"; }
    return null;
  }
  function summary(list) {
    const done = list.filter(b => ["won", "lost", "push", "void"].includes(b.status));
    const w = done.filter(b => b.status === "won").length, l = done.filter(b => b.status === "lost").length, p = done.filter(b => b.status === "push").length;
    const staked = done.filter(b => b.status !== "void").reduce((a, b) => a + b.stake, 0), profit = done.reduce((a, b) => a + profitOf(b), 0);
    const clv = done.filter(b => typeof b.close_odds === "number").map(b => implied(b.close_odds) - implied(b.odds));
    const edges = list.filter(b => typeof b.model_p === "number").map(b => b.model_p - implied(b.odds));
    return {w, l, p, n: done.length, open: list.filter(b => b.status === "open").length, staked, profit, roi: staked ? profit / staked : null,
      clvBeat: clv.length ? clv.filter(v => v > 0).length / clv.length : null, clvN: clv.length, edge: edges.length ? edges.reduce((a, b) => a + b, 0) / edges.length : null, edgeN: edges.length};
  }
  const betsCol = () => st.db.collection("data/users/" + st.uid);
  async function save(b) {
    try { const ref = b._id ? betsCol().doc(b._id) : betsCol().doc("bet_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
      const body = {...b}; delete body._id; await ref.set(body); return true; }
    catch (e) { flash(e.code === "quota_exceeded" ? "Storage is full. Delete some old bets and try again." : e.code === "invalid_argument" ? "This view can't save bets. Ask the owner for Contributor access." : "Couldn't save: " + (e.message || e.code)); return false; }
  }
  async function pushLeaderboard() {
    if (!st.db || !st.uid) return;
    try {
      const ref = st.db.doc("leaderboard/" + st.uid);
      if (!st.settings.share) { await ref.delete(); return; }
      const s = summary(st.bets);
      await ref.set({w: s.w, l: s.l, p: s.p, staked: Math.round(s.staked * 100) / 100, profit: Math.round(s.profit * 100) / 100, roi: s.roi, updated: new Date().toISOString()});
    } catch (e) { /* leaderboard is optional */ }
  }
  let root, flashEl;
  function flash(t) { if (flashEl) flashEl.textContent = t; }

  S.build = panel => {
    root = panel;
    const h = el("header", "sport");
    h.append(section("h1", null, "My Bets<small>Your record, what's kicking off next, and how your bets line up with the model</small>"),
      el("p", "lede", "Log each bet once. Link it to a game on the sheet and the page fills in the model's chance, reminds you when it kicks off, and suggests the result after the final. Your bets are private to you; you choose whether your totals show on the friends leaderboard."));
    panel.append(h, el("div", null)); S.body = panel.lastChild;
  };
  function input(label, node) { const w = el("label", "fld"); w.append(el("span", null, label), node); return w; }
  function sel(options, value) { const s = document.createElement("select"); for (const [v, t] of options) s.append(new Option(t, v)); if (value !== undefined) s.value = value; return s; }
  function num(ph) { const i = document.createElement("input"); i.type = "number"; i.step = "any"; i.placeholder = ph; return i; }
  function txt(ph) { const i = document.createElement("input"); i.type = "text"; i.placeholder = ph; return i; }

  function formBox() {
    const box = el("section", "bt"); box.append(el("h2", null, "Add a bet"));
    const games = sheetGames().filter(x => !x.g.final);
    const game = sel([["", "Not on the sheet"], ...games.map(x => [x.id, x.sport + ": " + x.label])]);
    const type = sel([["moneyline", "Moneyline"], ["spread", "Spread"], ["anytime_td", "Anytime TD"], ["total", "Total"], ["parlay", "Parlay"], ["other", "Other"]]);
    const side = sel([["", "Pick a side"]]); const player = sel([["", "Pick a player"]]);
    const line = num("e.g. -1.5"), odds = num("e.g. -124"), stake = num("e.g. 20"), pick = txt("e.g. Vikings -1.5");
    const book = txt("FanDuel"); book.value = "FanDuel";
    const est = el("p", "note");
    const fSide = input("Side", side), fLine = input("Line for that side", line), fPlayer = input("Player", player);
    function fillLists() {
      const x = findGame(game.value);
      side.replaceChildren(new Option("Pick a side", ""));
      if (x) { side.append(new Option(x.away, "away")); if (x.sport === "EPL") side.append(new Option("Draw", "draw")); side.append(new Option(x.home, "home")); }
      player.replaceChildren(new Option("Pick a player", ""));
      if (x && x.sport === "NFL" && NFL.props) for (const p of NFL.props.players.filter(p => p.game_id === x.id)) player.append(new Option(p.name + " (" + Math.round(p.p * 100) + "%)", p.name));
      refresh();
    }
    function refresh() {
      const x = findGame(game.value);
      fSide.hidden = !x || type.value === "anytime_td" || !["moneyline", "spread"].includes(type.value);
      fLine.hidden = type.value !== "spread" && type.value !== "total";
      fPlayer.hidden = !(x && x.sport === "NFL" && type.value === "anytime_td");
      estimate();
    }
    function draft() {
      const x = findGame(game.value);
      const b = {created: new Date().toISOString(), sport: x ? x.sport : "Other", game_id: x ? x.id : null, game_label: x ? x.label : null,
        kickoff_utc: x ? x.kickoff : null, type: type.value, side: side.value || null, player: player.value || null,
        line: line.value === "" ? null : Number(line.value), odds: Number(odds.value), stake: Number(stake.value), book: book.value.trim() || "FanDuel",
        status: "open", close_odds: null};
      b.pick = pick.value.trim() || [b.player ? b.player + " anytime TD" : null, b.side && x ? (b.side === "draw" ? "Draw" : x[b.side]) : null, b.type === "spread" && b.line !== null ? (b.line > 0 ? "+" : "") + b.line : null, b.type === "moneyline" ? "ML" : null].filter(Boolean).join(" ");
      b.model_p = modelChance(b);
      return b;
    }
    function estimate() {
      const b = draft();
      if (!odds.value || !(Math.abs(b.odds) >= 100)) { est.textContent = "American odds, like -124 or +150."; return; }
      const imp = implied(b.odds);
      est.textContent = "The price implies " + Math.round(imp * 100) + "%." + (typeof b.model_p === "number" ? " The model gives " + Math.round(b.model_p * 100) + "%, " + (b.model_p > imp ? "so it sees value." : "so it sees no value at this price.") : "");
    }
    game.onchange = fillLists;
    for (const n of [type, side, player]) n.onchange = refresh;
    for (const n of [line, odds]) n.oninput = estimate;
    const grid = el("div", "form");
    grid.append(input("Game", game), input("Bet type", type), fSide, fPlayer, fLine, input("Odds", odds), input("Stake ($)", stake), input("Book", book), input("Description (optional)", pick));
    const add = el("button", "btn", "Save bet");
    add.onclick = async () => {
      const b = draft();
      if (!(Math.abs(b.odds) >= 100) || !(b.stake > 0)) { flash("Enter American odds (like -124) and a stake."); return; }
      if (!b.pick) { flash("Add a short description of the bet."); return; }
      add.disabled = true; if (await save(b)) { flash("Saved: " + b.pick + "."); odds.value = stake.value = pick.value = line.value = ""; estimate(); } add.disabled = false;
    };
    flashEl = el("p", "status");
    const row = el("div", "row"); row.append(add, flashEl);
    box.append(grid, est, row); fillLists();
    return box;
  }

  function when(iso) {
    if (!iso) return "No kickoff time";
    const t = Date.parse(iso), mins = Math.round((t - Date.now()) / 60000);
    const at = new Date(iso).toLocaleString("en-US", {weekday:"short", hour:"numeric", minute:"2-digit", timeZone:"America/New_York"}) + " ET";
    if (mins > 0) return at + (mins < 180 ? " · starts in " + (mins < 60 ? mins + " min" : Math.round(mins / 6) / 10 + " h") : "");
    return at + " · started";
  }
  function betRow(b, open) {
    const tr = el("tr", open && b.kickoff_utc && Date.parse(b.kickoff_utc) - Date.now() < 3 * 3600e3 && Date.parse(b.kickoff_utc) > Date.now() ? "soon" : "");
    const d = el("td"); d.append(el("b", null, b.pick)); if (b.game_label) d.append(el("div", "note", b.game_label));
    tr.append(d);
    tr.append(el("td", null, (b.odds > 0 ? "+" : "") + b.odds), el("td", null, money(b.stake)), el("td", null, typeof b.model_p === "number" ? Math.round(b.model_p * 100) + "% vs " + Math.round(implied(b.odds) * 100) + "%" : "–"));
    const act = el("td", "acts");
    if (open) {
      act.append(el("div", "note", when(b.kickoff_utc)));
      const sug = suggestResult(b);
      const close = num("Closing odds (optional)"); close.className = "closein"; close.setAttribute("aria-label", "Closing odds, optional");
      const btns = el("div", "row");
      for (const r of ["won", "lost", "push", "void"]) {
        const x = el("button", "mini" + (sug === r ? " sug" : ""), r === sug ? "Final says " + r : r[0].toUpperCase() + r.slice(1));
        x.onclick = async () => { const c = Math.abs(Number(close.value)) >= 100 ? Number(close.value) : null; await save({...b, status: r, close_odds: c, settled_at: new Date().toISOString()}); };
        btns.append(x);
      }
      act.append(close, btns);
    } else {
      const p = profitOf(b); act.append(el("b", p > 0 ? "right" : p < 0 ? "wrong" : "", b.status[0].toUpperCase() + b.status.slice(1) + " " + money(p)));
      if (typeof b.close_odds === "number") act.append(el("div", "note", "Closed " + (b.close_odds > 0 ? "+" : "") + b.close_odds + (implied(b.close_odds) > implied(b.odds) ? ", you beat it" : "")));
    }
    const del = el("button", "mini ghost", "Delete");
    del.onclick = async () => {
      if (!del.dataset.armed) { del.dataset.armed = "1"; del.textContent = "Tap again to delete"; setTimeout(() => { delete del.dataset.armed; del.textContent = "Delete"; }, 4000); return; }
      try { await betsCol().doc(b._id).delete(); } catch (e) { flash("Couldn't delete: " + (e.message || e.code)); }
    };
    act.append(del); tr.append(act);
    return tr;
  }
  function table(rows, open) {
    const w = el("div", "tbl"), t = el("table", "bets");
    t.innerHTML = "<thead><tr><th>Bet</th><th>Odds</th><th>Stake</th><th>Model vs price</th><th>" + (open ? "Kickoff" : "Result") + "</th></tr></thead>";
    const body = el("tbody"); rows.forEach(b => body.append(betRow(b, open))); t.append(body); w.append(t); return w;
  }
  function importBox() {
    const d = el("details"); d.append(el("summary", null, "Import bets from a spreadsheet"));
    d.append(el("p", "note", "Paste one bet per line: date, sport, bet, type, odds, stake, result. Type is moneyline, spread, total, parlay or other; result is open, won, lost, push or void. A header row is skipped. Example: 2026-09-20, NFL, Bills ML, moneyline, -250, 25, won"));
    const ta = document.createElement("textarea"); ta.rows = 5; ta.className = "ta"; const go = el("button", "btn", "Import"); const note = el("span", "status");
    go.onclick = async () => {
      const lines = ta.value.split(/\r?\n/).map(l => l.trim()).filter(Boolean).slice(0, 200); let n = 0, bad = 0;
      go.disabled = true;
      for (const [i, l] of lines.entries()) {
        const c = l.split(",").map(x => x.trim());
        if (i === 0 && isNaN(Number(c[4]))) continue;          // header row
        if (c.length < 7 || isNaN(Number(c[4])) || isNaN(Number(c[5]))) { bad++; continue; }
        const status = ["open", "won", "lost", "push", "void"].includes(c[6].toLowerCase()) ? c[6].toLowerCase() : "open";
        const ok = await save({created: new Date(c[0]).toString() === "Invalid Date" ? new Date().toISOString() : new Date(c[0]).toISOString(), sport: c[1] || "Other", game_id: null, game_label: null, kickoff_utc: null,
          type: c[3].toLowerCase() || "other", side: null, player: null, line: null, odds: Number(c[4]), stake: Number(c[5]), book: c[7] || "FanDuel", pick: c[2], status, close_odds: null, model_p: null});
        if (ok) n++; else break;
      }
      note.textContent = "Imported " + n + " bet" + (n === 1 ? "" : "s") + (bad ? ", skipped " + bad + " line" + (bad === 1 ? "" : "s") + " that didn't match" : "") + ".";
      go.disabled = false; if (n) ta.value = "";
    };
    const r = el("div", "row"); r.append(go, note); d.append(ta, r);
    return d;
  }
  function leaderboardBox() {
    const box = el("section", "bt"); box.append(el("h2", null, "Friends leaderboard"));
    const lab = el("label", "check"), cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!st.settings.share;
    lab.append(cb, " Show my totals (record, profit, return) to everyone who can open this page. Individual bets stay private.");
    cb.onchange = async () => { st.settings.share = cb.checked; try { await betsCol().doc("settings").set({share: cb.checked}); } catch (e) {} await pushLeaderboard(); refreshBoard(); };
    parts.boardHolder = el("div");
    box.append(lab, parts.boardHolder);
    return box;
  }
  async function refreshBoard() {
    const holder = parts.boardHolder; if (!holder) return;
    try {
      const snap = await st.db.collection("leaderboard").get();
      const rows = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (b.profit || 0) - (a.profit || 0));
      if (!rows.length) { holder.replaceChildren(el("p", "note", "No one has shared yet. Friends need Contributor access to this page to take part.")); return; }
      const names = st.user && st.user.profiles ? await st.user.profiles(rows.map(r => r.id)) : {};
      const t = el("table"); t.innerHTML = "<thead><tr><th>Name</th><th>Record</th><th>Profit</th><th>Return</th></tr></thead>"; const body = el("tbody");
      for (const r of rows) { const tr = el("tr", r.id === st.uid ? "hl" : ""); tr.append(el("td", null, (names[r.id] && names[r.id].name) || (r.id === st.uid ? "You" : "Someone")), el("td", null, r.w + "–" + r.l + (r.p ? "–" + r.p : "")), el("td", null, money(r.profit || 0)), el("td", null, r.roi == null ? "–" : (r.roi >= 0 ? "+" : "−") + Math.abs(r.roi * 100).toFixed(1) + "%")); body.append(tr); }
      t.append(body); const w = el("div", "tbl"); w.append(t); holder.replaceChildren(w);

  }
  function statCard(label, value, sub) { const c = el("div", "stat"); c.append(el("span", "lab", label), el("b", null, value)); if (sub) c.append(el("span", "note", sub)); return c; }

  const parts = {};
  S.render = async () => {
    if (!S.body) return;

      parts.built = true;
    }
    const s = summary(st.bets);
    const stats = parts.stats; stats.replaceChildren();
    stats.append(statCard("Record", s.w + "–" + s.l + (s.p ? "–" + s.p : ""), s.open + " open"),
      statCard("Profit", money(s.profit), "on " + money(s.staked) + " staked"),
      statCard("Return", s.roi == null ? "–" : (s.roi >= 0 ? "+" : "−") + Math.abs(s.roi * 100).toFixed(1) + "%"),
      statCard("Beat the close", s.clvBeat == null ? "–" : Math.round(s.clvBeat * 100) + "%", s.clvN ? "of " + s.clvN + " bets with a closing price" : "add closing odds when you settle"),
      statCard("Model edge", s.edge == null ? "–" : (s.edge >= 0 ? "+" : "−") + Math.abs(s.edge * 100).toFixed(1) + " pts", s.edgeN ? "average over " + s.edgeN + " linked bets" : "link bets to sheet games"));
    const open = st.bets.filter(x => x.status === "open").sort((x, y) => (Date.parse(x.kickoff_utc) || 9e15) - (Date.parse(y.kickoff_utc) || 9e15));
    parts.open.replaceChildren(el("h2", "h2", "Open bets and what's kicking off next"), open.length ? table(open, true) : el("p", "empty", "No open bets."));
    const done = st.bets.filter(x => x.status !== "open").sort((x, y) => Date.parse(y.settled_at || y.created) - Date.parse(x.settled_at || x.created));
    parts.done.replaceChildren(el("h2", "h2", "Settled"), done.length ? table(done, false) : el("p", "empty", "Nothing settled yet."));
    refreshBoard();
  };
  setInterval(() => { if (parts.built && !document.getElementById("panel-bets").hidden) S.render(); }, 60000);   // keep "starts in" times fresh

  S.connect = async () => {
    if (!(window.claude && window.claude.use)) { st.msg = "Your bets are saved when this page is opened in claude.ai while signed in."; S.render(); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    st.db = db; st.user = user;
    st.uid = user ? await user.id() : null;
    if (!db || !st.uid) { st.msg = "Saving bets isn't available in this view. Open the page in claude.ai while signed in."; S.render(); return; }
    try { const sd = await betsCol().doc("settings").get(); if (sd.exists) st.settings = {...st.settings, ...sd.data()}; } catch (e) {}
    betsCol().onSnapshot(snap => {
      st.bets = snap.docs.filter(d => d.id.startsWith("bet_")).map(d => ({_id: d.id, ...d.data()}));
      st.ready = true; S.render();
      const sig = JSON.stringify(summary(st.bets)); if (st.settings.share && sig !== st.lastSig) { st.lastSig = sig; pushLeaderboard().then(refreshBoard); }
    }, e => { st.msg = e.code === "revoked" ? "Access to saved data was withdrawn. Reload to reconnect." : "Couldn't load your bets right now (" + e.code + ")."; st.ready = false; S.render(); });
  };
}

// ======================= tabs =======================
const BUILT = {nfl: nflSport, epl: eplSport, bets: betsTab};
const tabs = document.getElementById("tabs"), panels = document.getElementById("panels");
for (const s of SPORTS) {
  const b = el("button", "tab", s.label); b.setAttribute("role", "tab"); b.id = "tab-" + s.key;
  if (!BUILT[s.key]) { b.disabled = true; b.append(el("small", null, "soon")); }
  else {
    b.setAttribute("aria-controls", "panel-" + s.key);
    const p = el("section"); p.id = "panel-" + s.key; p.setAttribute("role", "tabpanel"); p.setAttribute("aria-labelledby", b.id); p.hidden = true;
    try { BUILT[s.key].build(p); BUILT[s.key].render(); }
    catch (e) { p.replaceChildren(el("p", "empty", "The " + s.label + " sheet couldn't load: " + e.message)); console.error(e); }
    panels.append(p);
    b.onclick = () => show(s.key);
  }
  tabs.append(b);
}
function show(key) {
  if (!BUILT[key]) key = "nfl";
  for (const k of Object.keys(BUILT)) { document.getElementById("panel-" + k).hidden = k !== key; document.getElementById("tab-" + k).setAttribute("aria-selected", String(k === key)); document.getElementById("tab-" + k).tabIndex = k === key ? 0 : -1; }
  try { if (location.hash !== "#" + key) history.replaceState(null, "", "#" + key); } catch (e) { /* sandboxed viewers block URL changes */ }
  try { window.scrollTo(0, 0); } catch (e) {}
}
tabs.addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const live = [...tabs.querySelectorAll(".tab:not(:disabled)")], i = live.indexOf(document.activeElement);
  if (i < 0) return; const n = live[(i + (e.key === "ArrowRight" ? 1 : live.length - 1)) % live.length]; n.focus(); n.click();
});
let startKey = "nfl"; try { startKey = (location.hash || "#nfl").slice(1); } catch (e) {}
show(startKey);
const ld = document.getElementById("loading"); if (ld) ld.remove();
betsTab.connect();

})();
